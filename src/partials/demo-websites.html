<div class="ol-craft" data-craft data-reveal="edge" data-ambient>

      <div class="ol-craft__controls">
        <div class="ol-tabs" role="tablist" aria-label="Craft dimensions">
          <button class="ol-tab" role="tab" aria-selected="true" tabindex="0" data-craft-tab="layout">Layout &amp; type</button>
          <button class="ol-tab" role="tab" aria-selected="false" tabindex="-1" data-craft-tab="motion">Motion</button>
          <button class="ol-tab" role="tab" aria-selected="false" tabindex="-1" data-craft-tab="performance">Performance</button>
          <button class="ol-tab" role="tab" aria-selected="false" tabindex="-1" data-craft-tab="conversion">Conversion</button>
        </div>

        <div class="ol-seg" role="group" aria-label="Viewport">
          <button class="ol-seg__btn is-on" type="button" data-craft-view="desktop" aria-pressed="true">Desktop</button>
          <button class="ol-seg__btn" type="button" data-craft-view="mobile" aria-pressed="false">Mobile</button>
        </div>
      </div>

      <div class="ol-craft__stage">
        <div class="ol-window ol-craft__frame" data-craft-frame data-mode="layout" data-view="desktop">
          <div class="ol-window__bar">
            <span class="ol-window__dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="ol-window__title" data-craft-url>a-orbitlift-build.example</span>
          </div>

          <div class="ol-craft__viewport">
            <div class="ol-craft__site" data-craft-site>
              <div class="ol-craft__grid-overlay" aria-hidden="true"></div>

              <div class="ol-craft__nav">
                <span class="ol-craft__logo"></span>
                <span class="ol-craft__navlinks"><i></i><i></i><i></i></span>
                <span class="ol-craft__navcta" data-focus="3"></span>
              </div>

              <div class="ol-craft__hero">
                <span class="ol-craft__eyebrow"></span>
                <p class="ol-craft__headline" data-focus="1">Type that does the heavy lifting</p>
                <p class="ol-craft__sub">Supporting line, one size down, dialled back so the headline keeps its job.</p>
                <span class="ol-craft__cta" data-focus="2">Get a quote</span>
              </div>

              <div class="ol-craft__cards">
                <span class="ol-craft__card"><i></i><i></i></span>
                <span class="ol-craft__card"><i></i><i></i></span>
                <span class="ol-craft__card"><i></i><i></i></span>
              </div>
            </div>

            <div class="ol-craft__skeleton" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>

        <p class="ol-craft__note" data-craft-note aria-live="polite"></p>
      </div>
    </div>
