{{robots}}<link rel="canonical" href="{{origin}}{{path}}">

<meta name="theme-color" content="#07060C">
<meta name="color-scheme" content="dark light">

<script>
  /* Sets the theme before first paint so the page never flashes the wrong one.
     Kept inline and tiny on purpose: an external file would be a round trip. */
  try {
    var t = localStorage.getItem('ol-theme');
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
