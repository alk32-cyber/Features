<div class="ol-bot__stage" data-reveal="edge" data-ambient>
        <div class="ol-bot__backdrop" aria-hidden="true">
          <span class="ol-bot__bd-bar"></span>
          <span class="ol-bot__bd-h"></span>
          <span class="ol-bot__bd-line"></span>
          <span class="ol-bot__bd-line ol-bot__bd-line--short"></span>
          <span class="ol-bot__bd-btn"></span>
          <span class="ol-bot__bd-block"></span>
          <span class="ol-bot__bd-block"></span>
        </div>

        <div class="ol-bot" data-bot>
          <div class="ol-bot__head">
            <span class="ol-bot__avatar" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 20 20"><use href="#i-chat"/></svg>
            </span>
            <span class="ol-bot__ident">
              <strong>Ask us anything</strong>
              <span class="ol-bot__status">Typically replies instantly</span>
            </span>
            <button class="ol-bot__reset" type="button" data-bot-reset aria-label="Restart the conversation">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M16.5 10a6.5 6.5 0 1 1-2.1-4.8M16.5 3.5V7H13"/></svg>
            </button>
          </div>

          <div class="ol-bot__log" data-bot-log role="log" aria-live="polite" aria-label="Chat conversation">
            <div class="ol-bot__msg ol-bot__msg--bot">Hi — I'm the assistant for this business. What can I help with?</div>
          </div>

          <div class="ol-bot__replies" data-bot-replies aria-label="Suggested replies"></div>

          <p class="ol-bot__footnote ol-mono">Demonstration · A real deployment answers from your own information</p>
        </div>
      </div>
